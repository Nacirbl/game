{% extends "base.html" %}

{% block title %}Quiz Results{% endblock %}

{% block header %}
<h1><i class="fas fa-chart-bar"></i> Quiz Results</h1>
<p>Analytics and session results</p>
{% endblock %}

{% block content %}
<div class="card">
    <h3 style="text-align: center; margin-bottom: 2rem;">
        <i class="fas fa-search"></i> View Results
    </h3>
    
    <div class="input-group" style="max-width: 400px; margin: 0 auto 2rem;">
        <label for="session-id-input">
            <i class="fas fa-key"></i> Session ID
        </label>
        <div style="display: flex; gap: 1rem;">
            <input type="text" id="session-id-input" placeholder="Enter session ID...">
            <button onclick="loadResults()" class="btn">
                <i class="fas fa-search"></i> Load
            </button>
        </div>
    </div>
    
    <div id="results-container" style="display: none;">
        <!-- Results will be loaded here -->
    </div>
    
    <div id="error-message" style="display: none; text-align: center; color: #dc3545; margin-top: 2rem;">
        <!-- Error messages -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadResults() {
        const sessionId = document.getElementById('session-id-input').value.trim();
        const container = document.getElementById('results-container');
        const errorDiv = document.getElementById('error-message');
        
        if (!sessionId) {
            showError('Please enter a session ID');
            return;
        }
        
        try {
            const response = await fetch(`/api/results/${sessionId}`);
            const data = await response.json();
            
            if (response.ok) {
                displayResults(data);
                container.style.display = 'block';
                errorDiv.style.display = 'none';
            } else {
                showError(data.error || 'Results not found');
            }
        } catch (error) {
            showError('Error loading results');
            console.error(error);
        }
    }
    
    function displayResults(results) {
        const container = document.getElementById('results-container');
        
        const completedAt = new Date(results.completed_at).toLocaleDateString();
        const startedAt = new Date(results.started_at).toLocaleDateString();
        
        container.innerHTML = `
            <div style="background: linear-gradient(45deg, #4caf50, #8bc34a); padding: 2rem; border-radius: 15px; margin-bottom: 2rem; text-align: center; color: white;">
                <h2 style="margin-bottom: 1rem;">${results.quiz_title}</h2>
                <p>Session: ${results.session_id}</p>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 15px; text-align: center;">
                    <div style="font-size: 2rem; color: var(--primary-color);">${results.total_questions}</div>
                    <div style="color: var(--text-light);">Questions</div>
                </div>
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 15px; text-align: center;">
                    <div style="font-size: 1.2rem; color: var(--secondary-color);">${startedAt}</div>
                    <div style="color: var(--text-light);">Started</div>
                </div>
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 15px; text-align: center;">
                    <div style="font-size: 1.2rem; color: var(--accent-color);">${completedAt}</div>
                    <div style="color: var(--text-light);">Completed</div>
                </div>
            </div>
            
            <h4 style="margin-bottom: 1rem;"><i class="fas fa-list-alt"></i> Choices Made</h4>
            <div id="choices-list">
                ${Object.entries(results.choices_summary).map(([key, choice], index) => `
                    <div style="background: #f8f9fa; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <h6>Question ${index + 1}</h6>
                            <span style="background: var(--primary-color); color: white; padding: 0.25rem 0.75rem; border-radius: 15px; font-size: 0.8rem;">
                                ${choice.choice_side === 'left' ? 'Left' : 'Right'} Choice
                            </span>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center;">
                            <div style="text-align: center; padding: 0.75rem; background: ${choice.choice_side === 'left' ? 'var(--primary-color)' : 'white'}; color: ${choice.choice_side === 'left' ? 'white' : 'var(--text-dark)'}; border-radius: 8px; border: 2px solid var(--primary-color);">
                                ${choice.options[0]}
                            </div>
                            <div style="color: var(--text-light); font-weight: bold;">VS</div>
                            <div style="text-align: center; padding: 0.75rem; background: ${choice.choice_side === 'right' ? 'var(--primary-color)' : 'white'}; color: ${choice.choice_side === 'right' ? 'white' : 'var(--text-dark)'}; border-radius: 8px; border: 2px solid var(--primary-color);">
                                ${choice.options[1]}
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        const container = document.getElementById('results-container');
        
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        container.style.display = 'none';
    }
    
    // Allow Enter key to search
    document.getElementById('session-id-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loadResults();
        }
    });
</script>
{% endblock %}
