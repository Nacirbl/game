{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center; max-width: 500px; margin: 0 auto;">
    <h1 style="margin-bottom: 3rem; color: var(--text-dark); font-size: 3rem;">
        <i class="fas fa-gamepad"></i><br>
        This or That
    </h1>
    
    <div style="display: flex; flex-direction: column; gap: 2rem; margin: 2rem 0;">
        
        <!-- Start New Game -->
        <div style="background: linear-gradient(45deg, #667eea, #764ba2); padding: 3rem 2rem; border-radius: 20px; color: white;">
            <i class="fas fa-rocket" style="font-size: 4rem; margin-bottom: 1rem;"></i>
            <h2 style="margin-bottom: 1rem;">Start New Game</h2>
            <div style="margin-top: 1.5rem;">
                <input type="text" 
                       id="new-player-name-input" 
                       placeholder="Enter your name..." 
                       style="width: 100%; padding: 1rem; border: none; border-radius: 10px; text-align: center; font-size: 1.1rem; margin-bottom: 1rem;">
                <button onclick="startNewGame()" class="btn" style="background: rgba(255,255,255,0.2); border: 2px solid white; color: white; font-size: 1.1rem; padding: 1rem 2rem;">
                    <i class="fas fa-rocket"></i> Start Game
                </button>
            </div>
        </div>
        
        <!-- Join Game -->
        <div style="background: linear-gradient(45deg, #4caf50, #8bc34a); padding: 3rem 2rem; border-radius: 20px; color: white;">
            <i class="fas fa-users" style="font-size: 4rem; margin-bottom: 1rem;"></i>
            <h2 style="margin-bottom: 1rem;">Join Friends</h2>
            <div style="margin-top: 1.5rem;">
                <input type="text" 
                       id="player-name-input" 
                       placeholder="Enter your name..." 
                       style="width: 100%; padding: 1rem; border: none; border-radius: 10px; text-align: center; font-size: 1.1rem; margin-bottom: 1rem;">
                <input type="text" 
                       id="session-id-input" 
                       placeholder="Enter game link or session ID..." 
                       style="width: 100%; padding: 1rem; border: none; border-radius: 10px; text-align: center; font-size: 1.1rem; margin-bottom: 1rem;">
                <button onclick="joinGame()" class="btn" style="background: rgba(255,255,255,0.2); border: 2px solid white; color: white; font-size: 1.1rem; padding: 1rem 2rem;">
                    <i class="fas fa-sign-in-alt"></i> Join Game
                </button>
            </div>
        </div>
        
    </div>
    
    <!-- Admin Link -->
    <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #eee;">
        <a href="/admin" style="color: var(--text-light); text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-cog"></i> Create Quiz (Admin)
        </a>
    </div>
    
</div>

<!-- Quiz Selection Modal -->
<div id="quiz-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;" onclick="closeModal()">
    <div class="card" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 600px; width: 90%; max-height: 80%; overflow-y: auto;" onclick="event.stopPropagation()">
        <h3 style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-list"></i> Choose a Quiz
        </h3>
        
        <div id="quiz-list" class="quiz-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <button onclick="closeModal()" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let quizzes = [];
    
    async function startNewGame() {
        const playerName = document.getElementById('new-player-name-input').value.trim();
        if (!playerName) {
            showNotification('Please enter your name first!', 'error');
            return;
        }
        
        // Store player name for later use
        localStorage.setItem('playerName', playerName);
        
        const modal = document.getElementById('quiz-modal');
        const quizList = document.getElementById('quiz-list');
        
        // Show the modal
        modal.style.display = 'block';
        
        try {
            const response = await fetch('/api/quizzes');
            quizzes = await response.json();
            
            if (quizzes.length === 0) {
                quizList.innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: var(--text-light);">
                        <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <h3>No quizzes available yet</h3>
                        <p>Create your first quiz!</p>
                        <a href="/admin" class="btn" style="margin-top: 1rem;">
                            <i class="fas fa-plus"></i> Create First Quiz
                        </a>
                    </div>
                `;
                return;
            }
            
            quizList.innerHTML = quizzes.map(quiz => `
                <div class="quiz-item" onclick="playQuiz('${quiz.id}')">
                    <div class="quiz-title">
                        <i class="fas fa-puzzle-piece"></i> ${quiz.title}
                    </div>
                    <div class="quiz-description">${quiz.description || 'No description'}</div>
                    <div class="quiz-meta">
                        <span><i class="fas fa-question-circle"></i> ${quiz.question_count} questions</span>
                    </div>
                </div>
            `).join('');
            
        } catch (error) {
            console.error('Error loading quizzes:', error);
            quizList.innerHTML = `
                <div style="text-align: center; padding: 3rem; color: var(--primary-color);">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                    <h3>Error loading quizzes</h3>
                    <p>Please try again later.</p>
                </div>
            `;
        }
    }
    
    function playQuiz(quizId) {
        const playerName = localStorage.getItem('playerName');
        showNotification(`Starting quiz...`);
        
        if (playerName) {
            // Pass player name as URL parameter
            window.location.href = `/play/${quizId}?player_name=${encodeURIComponent(playerName)}`;
        } else {
            window.location.href = `/play/${quizId}`;
        }
        closeModal();
    }
    
    async function joinGame() {
        const playerName = document.getElementById('player-name-input').value.trim();
        const input = document.getElementById('session-id-input').value.trim();
        
        if (!playerName) {
            showNotification('Please enter your name first!', 'error');
            return;
        }
        
        if (!input) {
            showNotification('Please enter a session ID or game link', 'error');
            return;
        }
        
        // Store player name for later use
        localStorage.setItem('playerName', playerName);
        
        // Extract session ID from URL if it's a full link
        let sessionId = input;
        if (input.includes('/session/')) {
            sessionId = input.split('/session/')[1];
        }
        
        showNotification(`Joining game...`);
        
        try {
            // Get the original session info
            const response = await fetch(`/api/session/${sessionId}`);
            if (response.ok) {
                const sessionData = await response.json();
                
                // Create a new session for the same quiz in the same group
                const createResponse = await fetch('/api/create-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quiz_id: sessionData.quiz_id,
                        shared_session_group: sessionData.shared_session_group || sessionId,
                        player_name: playerName
                    })
                });
                
                const createData = await createResponse.json();
                if (createData.success) {
                    window.location.href = `/session/${createData.session_id}`;
                } else {
                    // Fallback to original session
                    window.location.href = `/session/${sessionId}`;
                }
            } else {
                // Fallback to original session
                window.location.href = `/session/${sessionId}`;
            }
        } catch (error) {
            console.error('Error joining game:', error);
            // Fallback to original session
            window.location.href = `/session/${sessionId}`;
        }
    }
    
    function closeModal() {
        document.getElementById('quiz-modal').style.display = 'none';
    }
    
    function showNotification(message, type = 'success') {
        // Create toast notification
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            background: ${type === 'error' ? '#f44336' : '#4caf50'};
            color: white; padding: 1rem 1.5rem; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(400px); transition: transform 0.3s ease;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => toast.style.transform = 'translateX(0)', 100);
        setTimeout(() => {
            toast.style.transform = 'translateX(400px)';
            setTimeout(() => document.body.removeChild(toast), 300);
        }, 3000);
    }
    
    // Allow Enter key to join game
    document.getElementById('session-id-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            joinGame();
        }
    });
</script>
{% endblock %}
