events {
    worker_connections 1024;
}

http {
    # Define upstream servers
    upstream app_servers {
        # Load balancing method - least connections
        least_conn;
        
        # Backend servers
        server app1:2000 max_fails=3 fail_timeout=30s;
        server app2:2000 max_fails=3 fail_timeout=30s;
        server app3:2000 max_fails=3 fail_timeout=30s;
        
        # Enable keepalive connections
        keepalive 32;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # WebSocket support - map directive must be in http context
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    # Main server configuration
    server {
        listen 80;
        server_name localhost;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
        
        # Static files (if serving directly from nginx)
        location /static/ {
            proxy_pass http://app_servers;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
        
        # WebSocket endpoints
        location /ws/ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            
            # Disable buffering for WebSockets
            proxy_buffering off;
        }
        
        # API endpoints with higher rate limit
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # File upload endpoints with larger limits
        location ~ ^/(api/upload|api/create-quiz-from-image) {
            limit_req zone=general burst=5 nodelay;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Larger limits for file uploads
            client_max_body_size 20M;
            proxy_request_buffering off;
        }
        
        # All other requests
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Enable keepalive
            proxy_set_header Connection "keep-alive";
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://app_servers;
        }
    }
}